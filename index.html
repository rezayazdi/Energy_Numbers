<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>شماره ها | رستوران انرژی</title>
  <style>
    @font-face {
      font-family: "Vazirmatn";
      src: url("fonts/Vazirmatn-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Vazirmatn";
      src: url("fonts/Vazirmatn-Medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Vazirmatn";
      src: url("fonts/Vazirmatn-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #f4f4f5;
      --card: #ffffff;
      --fg: #18181b;
      --muted: #71717a;
      --primary: #18181b;
      --primary-hover: #27272a;
      --accent: #16a34a;
      --accent-hover: #15803d;
      --border: #d4d4d8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --pad: #e4e4e7;
      --pad-active: #a1a1aa;
      --toast-bg: #18181b;
      --toast-fg: #fafafa;
      --row-hover: #f4f4f5;
      --warn: #c2410c;
      --warn-bg: #ffedd5;
      --today: #18181b;
      --today-bg: #e4e4e7;
      --overlay: rgba(24, 24, 27, 0.5);
      --radius: 12px;
      --font: "Vazirmatn", Tahoma, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #09090b;
      --card: #18181b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --primary: #fafafa;
      --primary-hover: #e4e4e7;
      --accent: #22c55e;
      --accent-hover: #4ade80;
      --border: #3f3f46;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --pad: #27272a;
      --pad-active: #52525b;
      --toast-bg: #fafafa;
      --toast-fg: #18181b;
      --row-hover: #27272a;
      --warn: #fb923c;
      --warn-bg: #431407;
      --today: #fafafa;
      --today-bg: #3f3f46;
      --overlay: rgba(0, 0, 0, 0.7);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
    }

    .icon {
      width: 1.25em;
      height: 1.25em;
      display: inline-block;
      vertical-align: -0.2em;
      flex-shrink: 0;
    }
    .icon-lg { width: 1.5em; height: 1.5em; }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      min-height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(1.15rem, 2.4vw, 1.75rem);
      font-weight: 700;
      line-height: 1.35;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      padding: 12px 18px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.1s ease, color 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    .btn-icon {
      padding: 12px;
      min-width: 48px;
      min-height: 48px;
    }

    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-ghost {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--pad); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-nav-active { background: var(--primary); color: #18181b; }
    html:not([data-theme="dark"]) .btn-nav-active { color: #fff; }
    .btn-nav {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
    }
    .btn-called {
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      padding: 10px 14px;
      white-space: nowrap;
    }
    .btn-called:hover { background: var(--accent-hover); }
    .btn-called.is-done {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
    }
    .btn-row-danger,
    .btn-row-edit {
      background: transparent;
      padding: 10px;
      min-width: 48px;
      min-height: 48px;
      border: 2px solid;
    }
    .btn-row-danger {
      color: var(--danger);
      border-color: var(--danger);
    }
    .btn-row-danger:hover {
      background: var(--danger);
      color: #fff;
    }
    .btn-row-edit {
      color: var(--primary);
      border-color: var(--primary);
    }
    .btn-row-edit:hover {
      background: var(--primary);
      color: #18181b;
    }
    html:not([data-theme="dark"]) .btn-row-edit:hover { color: #fff; }

    .btn-filter {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      font-size: 1.05rem;
      padding: 10px 14px;
    }
    .btn-filter.active {
      background: var(--primary);
      color: #18181b;
      border-color: transparent;
    }
    html:not([data-theme="dark"]) .btn-filter.active { color: #fff; }

    .btn-page {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      min-width: 48px;
    }
    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page { display: none; }
    .page.active { display: block; }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .form-layout {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 360px);
      min-height: 560px;
    }

    .form-fields {
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-fields h2,
    .numpad h2,
    .list-toolbar h2 {
      margin: 0 0 16px;
      font-size: 1.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 8px;
    }

    .hint {
      margin: 4px 0 0;
      font-size: 1rem;
      font-weight: 500;
      color: var(--danger);
      min-height: 1.4em;
    }
    .hint[hidden] { display: none !important; }

    input[type="text"] {
      font-family: inherit;
      font-size: 1.55rem;
      font-weight: 500;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      color: var(--fg);
      background: var(--bg);
      width: 100%;
      text-align: center;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent);
    }

    .phone-wrap {
      --phone-h: 68px;
      --phone-r: 12px;
      display: flex;
      flex-direction: row;
      direction: ltr;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .phone-prefix {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      height: var(--phone-h);
      min-width: calc(var(--phone-h) + 12px);
      padding: 0 12px;
      font-size: 1.65rem;
      font-weight: 700;
      line-height: 1;
      color: var(--primary);
      background: var(--pad);
      border: 2px solid var(--border);
      border-radius: var(--phone-r);
      user-select: none;
      pointer-events: none;
      flex: 0 0 auto;
    }
    .phone-digits {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 6px;
      flex: 1 1 auto;
      min-width: 0;
      height: var(--phone-h);
      align-items: stretch;
    }
    .phone-digit {
      box-sizing: border-box;
      width: 100%;
      height: var(--phone-h);
      min-width: 0;
      font-family: inherit;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      color: var(--fg);
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--phone-r);
      padding: 0;
      margin: 0;
      direction: ltr;
      -moz-appearance: textfield;
    }
    .phone-digit::-webkit-outer-spin-button,
    .phone-digit::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .phone-digit:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 30%, transparent);
      z-index: 1;
      position: relative;
    }
    @media (max-width: 768px) {
      .phone-wrap {
        --phone-h: 56px;
        --phone-r: 10px;
        gap: 5px;
      }
      .phone-digits { gap: 4px; }
      .phone-digit { font-size: 1.3rem; }
      .phone-prefix { font-size: 1.35rem; }
    }

    .numpad {
      background: var(--pad);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }
    .pad-key {
      font-size: 2rem;
      font-weight: 700;
      min-height: 72px;
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .pad-key:hover { background: var(--pad-active); }
    .pad-key.clear { background: var(--danger); color: #fff; border-color: transparent; }
    .pad-key.back { background: var(--primary); color: #18181b; border-color: transparent; }
    html:not([data-theme="dark"]) .pad-key.back { color: #fff; }

    .list-toolbar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 14px;
    }
    .list-toolbar h2 { margin: 0; }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .filter-count {
      margin-inline-start: auto;
      font-size: 1.05rem;
      color: var(--muted);
      font-weight: 500;
    }
    .export-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .export-label {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--muted);
    }

    .export-sheet { display: none; }
    @page { size: A4; margin: 14mm; }
    @media print {
      body.exporting {
        background: #fff !important;
        color: #111 !important;
      }
      body.exporting .shell,
      body.exporting .modal-backdrop,
      body.exporting .toast { display: none !important; }
      body.exporting .export-sheet {
        display: block !important;
        font-family: var(--font);
      }
      body.exporting .export-sheet h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 700;
      }
      body.exporting .export-sheet .export-meta {
        margin: 0 0 14px;
        color: #444;
        font-size: 13px;
      }
      body.exporting .export-sheet table {
        width: 100%;
        border-collapse: collapse;
      }
      body.exporting .export-sheet th,
      body.exporting .export-sheet td {
        border: 1px solid #ccc;
        padding: 8px 10px;
        text-align: right;
        font-size: 14px;
      }
      body.exporting .export-sheet th {
        background: #f4f4f5;
        font-weight: 700;
      }
      body.exporting .export-sheet td.num {
        direction: ltr;
        text-align: left;
      }
      body.exporting .export-sheet thead { display: table-header-group; }
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      max-height: 52dvh;
      overflow: auto;
    }

    .contact-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      border-inline-start: 4px solid transparent;
    }
    .contact-row:last-child { border-bottom: none; }
    .contact-row:hover { background: var(--row-hover); }
    .contact-row.called {
      background: color-mix(in srgb, var(--accent) 10%, var(--card));
      border-inline-start-color: var(--accent);
    }
    .contact-row.pending {
      background: color-mix(in srgb, var(--warn) 8%, var(--card));
      border-inline-start-color: var(--warn);
    }
    .contact-row.is-today {
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--today) 35%, transparent);
    }

    .contact-meta { min-width: 0; }
    .contact-name {
      font-size: 1.45rem;
      font-weight: 700;
      margin: 0 0 6px;
      word-break: break-word;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .contact-phone {
      font-size: 1.35rem;
      font-weight: 500;
      color: var(--primary);
      margin: 0 0 4px;
      direction: ltr;
      text-align: right;
    }
    .contact-date {
      font-size: 1.05rem;
      color: var(--muted);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      line-height: 1.2;
    }
    .badge-today {
      background: var(--today-bg);
      color: var(--today);
    }
    .badge-pending {
      background: var(--warn-bg);
      color: var(--warn);
    }
    .badge-done {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
    }

    .contact-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .pager-info {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--muted);
      min-width: 8ch;
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop[hidden] { display: none !important; }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--card);
      color: var(--fg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: min(440px, 100%);
      box-shadow: 0 20px 50px color-mix(in srgb, var(--fg) 18%, transparent);
    }
    .modal h3 {
      margin: 0 0 10px;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal p {
      margin: 0 0 22px;
      font-size: 1.15rem;
      color: var(--muted);
      line-height: 1.6;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .name-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .name-row input { flex: 1 1 auto; min-width: 0; }
    .name-row .btn-paste {
      flex: 0 0 auto;
      min-width: 56px;
      padding: 0 14px;
      background: var(--card);
      color: var(--fg);
      border: 2px solid var(--border);
    }
    .name-row .btn-paste:hover { background: var(--pad); }

    .save-row {
      margin-top: 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .form-toast {
      margin-top: 14px;
      display: none;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--accent) 16%, var(--card));
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .form-toast.show { display: flex; }

    .empty {
      padding: 56px 24px;
      text-align: center;
      font-size: 1.4rem;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty[hidden] { display: none !important; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--toast-bg);
      color: var(--toast-fg);
      font-size: 1.2rem;
      font-weight: 500;
      padding: 14px 24px;
      border-radius: var(--radius);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.show { opacity: 1; }

    @media (max-width: 768px) {
      .form-layout { grid-template-columns: 1fr; }
      .brand h1 { font-size: 1.5rem; }
      .pad-key { min-height: 64px; font-size: 1.75rem; }
      .contact-row {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .contact-actions { width: 100%; }
      .btn-called { flex: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      button, .toast { transition: none; }
    }
  </style>
</head>

  <script>
    const KEY = "energy-numbers-contacts";
    const THEME_KEY = "energy-numbers-theme";
    const PAGE_SIZE = 5;
    const PHONE_RE = /^09\d{9}$/;
    const FA_DIGITS = "۰۱۲۳۴۵۶۷۸۹";

    const nameEl = document.getElementById("name");
    const digitEls = Array.from(document.querySelectorAll(".phone-digit"));
    const listEl = document.getElementById("list");
    const empty = document.getElementById("empty");
    const toast = document.getElementById("toast");
    const themeIcon = document.getElementById("theme-icon");
    const pager = document.getElementById("pager");
    const modal = document.getElementById("confirm-modal");
    const cancelEditBtn = document.getElementById("cancel-edit");

    let contacts = [];
    let filter = "all";
    let page = 1;
    let editingId = null;
    let pendingDeleteId = null;

    function loadLocal() {
      try {
        const raw = localStorage.getItem(KEY);
        const data = raw ? JSON.parse(raw) : [];
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(contacts));
      if (window.energy && window.energy.saveBackup) {
        window.energy.saveBackup(contacts);
      }
    }

    function migrate(list) {
      return list.map((c) => {
        if (c.createdAt) return c;
        const createdAt = new Date().toISOString();
        return {
          ...c,
          createdAt,
          created: c.created || new Date(createdAt).toLocaleString("fa-IR"),
        };
      });
    }

    function bootContacts() {
      let list = loadLocal();
      if (window.energy && window.energy.loadBackup) {
        const file = window.energy.loadBackup();
        if (file !== null) list = file;
      }
      contacts = migrate(list);
      save();
    }

    function showToast(msg, ms) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(
        () => toast.classList.remove("show"),
        ms == null ? 1800 : ms
      );
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(THEME_KEY, theme);
      themeIcon.innerHTML =
        theme === "dark"
          ? '<use href="#ph-sun"></use>'
          : '<use href="#ph-moon"></use>';
      document.getElementById("theme-toggle").setAttribute(
        "aria-label",
        theme === "dark" ? "حالت روشن" : "حالت تاریک"
      );
    }

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === "light" || saved === "dark") {
        applyTheme(saved);
        return;
      }
      applyTheme("dark");
    }

    document.getElementById("theme-toggle").onclick = () => {
      const next =
        document.documentElement.getAttribute("data-theme") === "dark"
          ? "light"
          : "dark";
      applyTheme(next);
    };

    function toFaDigits(n) {
      return String(n).replace(/\d/g, (d) => FA_DIGITS[Number(d)]);
    }

    function dayKey(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate();
    }

    function isToday(iso) {
      return dayKey(iso) === dayKey(new Date().toISOString());
    }

    function formatCreated(c) {
      if (c.created) return c.created;
      if (!c.createdAt) return "";
      return new Date(c.createdAt).toLocaleString("fa-IR");
    }

    function normalizePhone(raw) {
      return String(raw || "")
        .replace(/[۰-۹]/g, (d) => String(FA_DIGITS.indexOf(d)))
        .replace(/\D/g, "");
    }

    function phoneSuffix(raw) {
      let digits = normalizePhone(raw);
      if (digits.startsWith("09")) digits = digits.slice(2);
      return digits.slice(0, 9);
    }

    function readDigits() {
      return digitEls.map((el) => normalizePhone(el.value).slice(0, 1)).join("");
    }

    function writeDigits(suffix) {
      const s = phoneSuffix(suffix);
      digitEls.forEach((el, i) => {
        el.value = s[i] || "";
      });
    }

    function focusDigit(i) {
      const el = digitEls[Math.max(0, Math.min(digitEls.length - 1, i))];
      el.focus();
      el.select();
    }

    function fullPhone() {
      return "09" + readDigits();
    }

    function resetPhone() {
      writeDigits("");
      setPhoneHint();
    }

    function setPhoneHint(msg) {
      const hint = document.getElementById("phone-hint");
      if (msg) {
        hint.textContent = msg;
        hint.hidden = false;
      } else {
        hint.textContent = "";
        hint.hidden = true;
      }
    }

    function isValidPhone(digits) {
      return PHONE_RE.test(digits);
    }

    function isDuplicatePhone(digits, exceptId) {
      return contacts.some(
        (c) => c.id !== exceptId && normalizePhone(c.phone) === digits
      );
    }

    function setEditMode(on, contact) {
      editingId = on && contact ? contact.id : null;
      document.getElementById("form-title-text").textContent = on
        ? "ویرایش تماس"
        : "ثبت تماس";
      document.getElementById("save-label").textContent = on
        ? "بروزرسانی"
        : "ذخیره";
      cancelEditBtn.hidden = !on;
      if (on && contact) {
        nameEl.value = contact.name;
        writeDigits(contact.phone);
      } else {
        nameEl.value = "";
        resetPhone();
      }
      setPhoneHint();
    }

    function cancelEdit() {
      setEditMode(false);
    }

    function showPage(name) {
      document.querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
      document.getElementById("page-" + name).classList.add("active");
      document.getElementById("nav-form").className =
        name === "form" ? "btn-nav-active" : "btn-nav";
      document.getElementById("nav-list").className =
        name === "list" ? "btn-nav-active" : "btn-nav";
      if (name === "list") {
        if (!editingId) cancelEdit();
        renderList();
      }
      if (name === "form") nameEl.focus();
    }

    document.getElementById("nav-form").onclick = () => {
      if (!editingId) cancelEdit();
      showPage("form");
    };
    document.getElementById("nav-list").onclick = () => showPage("list");
    cancelEditBtn.onclick = () => {
      cancelEdit();
      showToast("ویرایش لغو شد");
    };

    document.getElementById("pad").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.digit != null) {
        const cur = readDigits();
        if (cur.length >= 9) {
          focusDigit(8);
          return;
        }
        writeDigits(cur + btn.dataset.digit);
        setPhoneHint();
        focusDigit(Math.min(8, readDigits().length));
        return;
      }
      if (btn.dataset.action === "clear") {
        resetPhone();
        focusDigit(0);
        return;
      }
      if (btn.dataset.action === "back") {
        const cur = readDigits();
        writeDigits(cur.slice(0, -1));
        setPhoneHint();
        focusDigit(Math.max(0, cur.length - 2));
      }
    });

    digitEls.forEach((el, i) => {
      el.addEventListener("input", () => {
        const v = normalizePhone(el.value).slice(-1);
        el.value = v;
        setPhoneHint();
        if (v && i < digitEls.length - 1) focusDigit(i + 1);
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Backspace") {
          if (el.value) {
            el.value = "";
            setPhoneHint();
            e.preventDefault();
            return;
          }
          if (i > 0) {
            e.preventDefault();
            digitEls[i - 1].value = "";
            focusDigit(i - 1);
            setPhoneHint();
          }
          return;
        }
        if (e.key === "ArrowLeft" && i > 0) {
          e.preventDefault();
          focusDigit(i - 1);
        }
        if (e.key === "ArrowRight" && i < digitEls.length - 1) {
          e.preventDefault();
          focusDigit(i + 1);
        }
        if (e.key === "Enter") {
          e.preventDefault();
          document.getElementById("save-btn").click();
        }
      });
      el.addEventListener("paste", (e) => {
        e.preventDefault();
        const pasted = phoneSuffix(e.clipboardData.getData("text"));
        if (!pasted) return;
        writeDigits(pasted);
        setPhoneHint();
        focusDigit(Math.min(8, pasted.length));
      });
      el.addEventListener("focus", () => el.select());
    });

    nameEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === "Tab") {
        if (e.key === "Enter") {
          e.preventDefault();
          focusDigit(0);
        }
      }
    });

    async function pasteNameFromClipboard() {
      let text = "";
      try {
        if (window.energy && window.energy.readClipboard) {
          text = window.energy.readClipboard() || "";
        } else if (navigator.clipboard && navigator.clipboard.readText) {
          text = await navigator.clipboard.readText();
        }
      } catch {
        text = "";
      }
      text = String(text || "").trim().split(/\r?\n/)[0].trim();
      if (!text) {
        showToast("کلیپ‌بورد خالی است");
        return;
      }
      nameEl.value = text;
      nameEl.focus();
      showToast("نام از کلیپ‌بورد چسبانده شد");
    }

    document.getElementById("paste-name").onclick = () => {
      pasteNameFromClipboard();
    };

    window.addEventListener("beforeunload", () => {
      try {
        localStorage.setItem(KEY, JSON.stringify(contacts));
        if (window.energy && window.energy.saveBackup) {
          window.energy.saveBackup(contacts);
        }
      } catch {}
    });

    document.getElementById("save-btn").onclick = () => {
      const name = nameEl.value.trim();
      const phone = fullPhone();
      if (!name) {
        showToast("لطفاً نام را وارد کنید");
        nameEl.focus();
        return;
      }
      if (!isValidPhone(phone)) {
        setPhoneHint(
          readDigits().length === 0
            ? "شماره را کامل وارد کنید"
            : "شماره ناقص است. باید ۹ رقم بعد از ۰۹ باشد"
        );
        showToast("شماره نامعتبر است");
        focusDigit(Math.min(8, readDigits().length));
        return;
      }
      if (isDuplicatePhone(phone, editingId)) {
        setPhoneHint("این شماره قبلاً ثبت شده است");
        showToast("شماره تکراری است");
        focusDigit(0);
        return;
      }

      if (editingId) {
        const c = contacts.find((x) => x.id === editingId);
        if (!c) return;
        c.name = name;
        c.phone = phone;
        save();
        cancelEdit();
        showToast("بروزرسانی شد");
        showPage("list");
        return;
      }

      const createdAt = new Date().toISOString();
      contacts.unshift({
        id: crypto.randomUUID(),
        name,
        phone,
        called: false,
        createdAt,
        created: new Date(createdAt).toLocaleString("fa-IR"),
      });
      save();
      nameEl.value = "";
      resetPhone();
      page = 1;
      filter = "today";
      syncFilterButtons();
      setPhoneHint();
      showFormToast();
      nameEl.focus();
    };

    function showFormToast() {
      const el = document.getElementById("form-toast");
      el.classList.add("show");
      clearTimeout(showFormToast._t);
      showFormToast._t = setTimeout(() => el.classList.remove("show"), 5000);
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function filteredContacts() {
      return contacts.filter((c) => {
        if (filter === "today") return isToday(c.createdAt);
        if (filter === "pending") return !c.called;
        if (filter === "called") return !!c.called;
        return true;
      });
    }

    function syncFilterButtons() {
      document.querySelectorAll(".btn-filter").forEach((b) => {
        b.classList.toggle("active", b.dataset.filter === filter);
      });
    }

    document.querySelector(".filter-row").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-filter]");
      if (!btn) return;
      filter = btn.dataset.filter;
      page = 1;
      syncFilterButtons();
      renderList();
    });

    function openDeleteModal(id) {
      const c = contacts.find((x) => x.id === id);
      if (!c) return;
      pendingDeleteId = id;
      document.getElementById("confirm-text").textContent =
        "شماره " + c.phone + " مربوط به «" + c.name + "» حذف شود؟";
      modal.hidden = false;
      requestAnimationFrame(() => modal.classList.add("open"));
    }

    function closeDeleteModal() {
      modal.classList.remove("open");
      pendingDeleteId = null;
      setTimeout(() => {
        modal.hidden = true;
      }, 180);
    }

    document.getElementById("confirm-cancel").onclick = closeDeleteModal;
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeDeleteModal();
    });
    document.getElementById("confirm-ok").onclick = () => {
      if (!pendingDeleteId) return;
      contacts = contacts.filter((c) => c.id !== pendingDeleteId);
      save();
      closeDeleteModal();
      const totalPages = Math.max(1, Math.ceil(filteredContacts().length / PAGE_SIZE));
      if (page > totalPages) page = totalPages;
      renderList();
      showToast("حذف شد");
    };

    function startEdit(id) {
      const c = contacts.find((x) => x.id === id);
      if (!c) return;
      setEditMode(true, c);
      showPage("form");
    }

    function toggleCalled(id) {
      const c = contacts.find((x) => x.id === id);
      if (!c) return;
      c.called = !c.called;
      save();
      renderList();
      showToast(c.called ? "تماس گرفته شد" : "علامت برداشته شد");
    }

    function renderList() {
      const items = filteredContacts();
      const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE) || 1);
      if (page > totalPages) page = totalPages;
      const start = (page - 1) * PAGE_SIZE;
      const slice = items.slice(start, start + PAGE_SIZE);

      listEl.innerHTML = "";
      empty.hidden = items.length > 0;
      document.getElementById("empty-text").textContent =
        contacts.length === 0
          ? "هنوز تماسی ثبت نشده."
          : "موردی با این فیلتر پیدا نشد.";

      document.getElementById("filter-count").textContent =
        toFaDigits(items.length) + " مورد";

      slice.forEach((c) => {
        const today = isToday(c.createdAt);
        const row = document.createElement("article");
        row.className =
          "contact-row" +
          (c.called ? " called" : " pending") +
          (today ? " is-today" : "");

        const badges =
          (today
            ? '<span class="badge badge-today">امروز</span>'
            : "") +
          (c.called
            ? '<span class="badge badge-done">تماس گرفته</span>'
            : '<span class="badge badge-pending">تماس نگرفته</span>');

        row.innerHTML =
          '<div class="contact-meta">' +
            '<p class="contact-name">' +
              escapeHtml(c.name) +
              badges +
            "</p>" +
            '<p class="contact-phone">' + escapeHtml(c.phone) + "</p>" +
            '<p class="contact-date">' +
              '<svg class="icon" aria-hidden="true"><use href="#ph-calendar"></use></svg>' +
              "تاریخ ثبت: " +
              escapeHtml(formatCreated(c)) +
            "</p>" +
          "</div>" +
          '<div class="contact-actions">' +
            '<button type="button" class="btn-called' +
              (c.called ? " is-done" : "") +
              '" data-act="call" data-id="' +
              c.id +
              '">' +
              (c.called
                ? '<svg class="icon" aria-hidden="true"><use href="#ph-check-circle"></use></svg> تماس گرفته شد'
                : '<svg class="icon" aria-hidden="true"><use href="#ph-phone-check"></use></svg> تماس گرفتم') +
            "</button>" +
            '<button type="button" class="btn-row-edit" data-act="edit" data-id="' +
              c.id +
              '" aria-label="ویرایش">' +
              '<svg class="icon" aria-hidden="true"><use href="#ph-pencil"></use></svg>' +
            "</button>" +
            '<button type="button" class="btn-row-danger" data-act="del" data-id="' +
              c.id +
              '" aria-label="حذف">' +
              '<svg class="icon" aria-hidden="true"><use href="#ph-trash"></use></svg>' +
            "</button>" +
          "</div>";
        listEl.appendChild(row);
      });

      const showPager = items.length > PAGE_SIZE;
      pager.hidden = !showPager;
      document.getElementById("page-info").textContent =
        toFaDigits(page) + " / " + toFaDigits(totalPages);
      document.getElementById("page-prev").disabled = page <= 1;
      document.getElementById("page-next").disabled = page >= totalPages;
    }

    document.getElementById("page-prev").onclick = () => {
      if (page > 1) {
        page -= 1;
        renderList();
      }
    };
    document.getElementById("page-next").onclick = () => {

    listEl.addEventListener("click", (e) => {

      if (btn.dataset.act === "del") openDeleteModal(btn.dataset.id);
      if (btn.dataset.act === "edit") startEdit(btn.dataset.id);
    });

    function csvCell(value) {

    function toCsv(rows) {
      const lines = [csvCell("نام") + "," + csvCell("شماره")];
      rows.forEach((row) => lines.push(csvCell(row.name) + "," + csvCell(row.phone)));
      return "\uFEFF" + lines.join("\r\n") + "\r\n";

    function xmlEscape(value) {
      return String(value)
        .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function crc32(bytes) {
      let c = ~0;
      for (let i = 0; i < bytes.length; i++) {
        c ^= bytes[i];
        for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (0xedb88320 & -(c & 1));
      }
      return ~c >>> 0;
    }

    function le(n, size) {
      const b = new Uint8Array(size);
      for (let i = 0; i < size; i++) b[i] = (n >>> (8 * i)) & 255;
      return b;
    }

    function concatBytes(parts) {
      let len = 0;
      parts.forEach((p) => {
        len += p.length;
      });
      const out = new Uint8Array(len);
      let offset = 0;
      parts.forEach((p) => {
        out.set(p, offset);
        offset += p.length;
      });
      return out;
    }

    function zipStore(files) {
      const enc = new TextEncoder();
      const locals = [];
      const centrals = [];
      let offset = 0;
      files.forEach((file) => {
        const name = enc.encode(file.name);
        const data = enc.encode(file.data);
        const crc = crc32(data);
        const local = concatBytes([
          le(0x04034b50, 4),
          le(20, 2),
          le(0, 2),
          le(0, 2),
          le(0, 2),
          le(0, 2),
          le(crc, 4),
          le(data.length, 4),
          le(data.length, 4),
          le(name.length, 2),
          le(0, 2),
          name,
          data,
        ]);
        locals.push(local);
        centrals.push(
          concatBytes([
            le(0x02014b50, 4),
            le(20, 2),
            le(20, 2),
            le(0, 2),
            le(0, 2),
            le(0, 2),
            le(0, 2),
            le(crc, 4),
            le(data.length, 4),
            le(data.length, 4),
            le(name.length, 2),
            le(0, 2),
            le(0, 2),
            le(0, 2),
            le(0, 2),
            le(0, 4),
            le(offset, 4),
            name,
          ])
        );
        offset += local.length;
      });
      const central = concatBytes(centrals);
      return concatBytes(
        locals.concat([
          central,
          concatBytes([
            le(0x06054b50, 4),
            le(0, 2),
            le(0, 2),
            le(files.length, 2),
            le(files.length, 2),
            le(central.length, 4),
            le(offset, 4),
            le(0, 2),
          ]),
        ])
      );
    }

          data:
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
            '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
            "</Relationships>",
        },
        {
          name: "xl/workbook.xml",
          data:
            '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
            '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
            '<sheets><sheet name="شماره ها" sheetId="1" r:id="rId1"/></sheets></workbook>',
        },
        {
          name: "xl/_rels/workbook.xml.rels",

    function fillExportSheet(rows) {
      const body = rows
        .map(
          (row) =>
            "<tr><td>" +
            escapeHtml(row.name) +
            '</td><td class="num">' +
            escapeHtml(row.phone) +
            "</td></tr>"
        )
        .join("");
      document.getElementById("export-sheet").innerHTML =
        "<h1>لیست نام و شماره‌ها</h1>" +
        '<p class="export-meta">' +
        escapeHtml(FILTER_FA[filter] || "") +
        "، " +
        toFaDigits(rows.length) +
        " مورد</p>" +
        "<table><thead><tr><th>نام</th><th>شماره</th></tr></thead><tbody>" +
        body +
        "</tbody></table>";
    }

    async function saveBytes(filename, ext, bytes, filterName) {
      if (window.energy && window.energy.saveFile) {
        return window.energy.saveFile({ filename, ext, bytes, filterName });
      }
      const a = document.createElement("a");
      const url = URL.createObjectURL(new Blob([bytes]));
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return true;
    }

    document.getElementById("export-csv").onclick = async () => {
      const rows = exportRows();
      if (!rows) return;
      try {
        const ok = await saveBytes(
          exportBaseName() + ".csv",
          "csv",
          new TextEncoder().encode(toCsv(rows)),
          "CSV"
        );
        if (ok) showToast("فایل CSV ذخیره شد");
      } catch {
        showToast("ذخیره CSV نشد");
      }
    };

    document.getElementById("export-xlsx").onclick = async () => {
      const rows = exportRows();
      if (!rows) return;
      try {
        const ok = await saveBytes(
          exportBaseName() + ".xlsx",
          "xlsx",
          toXlsx(rows),
          "Excel"
        );
        if (ok) showToast("فایل Excel ذخیره شد");
      } catch {
        showToast("ذخیره Excel نشد");
      }
    };

    document.getElementById("export-pdf").onclick = async () => {
      const rows = exportRows();
      if (!rows) return;
      fillExportSheet(rows);
      document.body.classList.add("exporting");
      try {
        if (window.energy && window.energy.savePdf) {
          const ok = await window.energy.savePdf(exportBaseName() + ".pdf");
          if (ok) showToast("PDF ذخیره شد");
          return;
        }
        await new Promise((resolve) => {
          const done = () => {
            window.removeEventListener("afterprint", done);
            resolve();
          };
          window.addEventListener("afterprint", done);
          window.print();
        });
      } catch {
        showToast("ذخیره PDF نشد");
      } finally {
        document.body.classList.remove("exporting");
      }
    };

    bootContacts();
    initTheme();
    syncFilterButtons();

    if (location.search.includes("check=1")) {
      const sample = [
        {
          id: "a",
          phone: "09121111111",
          called: false,
          createdAt: new Date().toISOString(),
        },
        {
          id: "b",
          phone: "09122222222",
          called: true,
          createdAt: "2020-01-01T00:00:00.000Z",
        },
      ];
      const todayCount = sample.filter((c) => isToday(c.createdAt)).length;
      const csv = toCsv([{ name: 'علی "الف"', phone: "09121111111" }]);
      const xlsxText = new TextDecoder().decode(
        toXlsx([{ name: "a<b", phone: "09121111111" }])
      );
      const ok =
        isValidPhone("09121234567") &&
        !isValidPhone("091212345") &&
        isDuplicatePhone.toString().includes("exceptId") &&
        todayCount === 1 &&
        csv.startsWith("\uFEFF") &&
        csv.includes('"علی ""الف"""') &&
        csv.includes('"09121111111"') &&
        crc32(new TextEncoder().encode("123456789")) === 0xcbf43926 &&
        xlsxText.startsWith("PK") &&
        xlsxText.includes("a&lt;b") &&
        xlsxText.includes(">09121111111<") &&
        xlsxText.includes('t="inlineStr"');
      document.body.innerHTML = ok ? "<pre>ok</pre>" : "<pre>fail</pre>";
    }
  </script>
</body>
</html>
